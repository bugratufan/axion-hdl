name: Bugra (HDL Developer Agent)

on:
  workflow_dispatch:
    inputs:
      focus:
        description: "Optional: specific scenario or area to focus testing on"
        required: false
        type: string

jobs:
  run:
    runs-on: [self-hosted, self-hosted-personal]
    timeout-minutes: 180
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Pick smartest active local model
        id: model
        run: |
          AGENT=$(bash .github/scripts/pick_local_agent.sh) || {
            echo "::error::No suitable local model is currently active on the dashboard (http://localhost:3333)"
            exit 1
          }
          echo "agent=$AGENT" >> "$GITHUB_OUTPUT"
          echo "Selected opencode agent: $AGENT"

      - name: Build agent image
        run: docker build -t axion-hdl-agent:latest -f ci/Dockerfile.agent ci

      - name: Ensure report label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "hdl-developer-report" \
            --color "0e8a16" \
            --description "Automated bug report from Bugra, the hdl-developer agent" 2>/dev/null || true

      - name: Install axion-hdl in dev mode
        run: |
          docker run --rm \
            --network host \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$PWD:/workspace" \
            -w /workspace \
            axion-hdl-agent:latest \
            bash -c "python3 -m venv .venv && .venv/bin/pip install --upgrade pip && .venv/bin/pip install -e '.[dev,gui]'"

      - name: Run hdl-developer agent
        env:
          FOCUS_HINT: ${{ inputs.focus }}
          PICKED_AGENT: ${{ steps.model.outputs.agent }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PROMPT=$(cat <<EOF
          You are Bugra, acting as a real end user of the axion-hdl tool (an AXI4-Lite
          register-interface generator from VHDL annotations, YAML, XML, or JSON).

          The repo is already installed in dev mode in a virtual environment at
          .venv (run "source .venv/bin/activate" before using the axion-hdl CLI or
          running pytest - do not reinstall it yourself).

          Put together several realistic usage scenarios of your own choosing that a
          hardware engineer would actually try: different input formats, edge cases in
          register/bit-field definitions, CDC options, GUI usage where relevant. Actually
          run them with the CLI/GUI, and use ghdl/verilator to sanity-check generated
          VHDL where applicable. Note anything confusing, broken, or surprising. ${FOCUS_HINT}

          For every distinct bug, broken behavior, or point of confusion you find, open
          it immediately as its own GitHub issue with "gh issue create --title '...'
          --body '...' --label hdl-developer-report" (gh is already authenticated via
          GH_TOKEN). One issue per distinct problem - never bundle multiple unrelated
          problems into a single issue, and do not open an issue for scenarios that
          worked fine. Do not write a summary report file and do not run any git
          commands - filing issues as you go is the whole job.
          EOF
          )

          docker run --rm \
            --network host \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e GH_TOKEN \
            -e GH_REPO="${{ github.repository }}" \
            -v "$PWD:/workspace" \
            -v /home/admin/.opencode/bin/opencode:/usr/local/bin/opencode:ro \
            -v /home/admin/.config/opencode:/tmp/.config/opencode:ro \
            -w /workspace \
            axion-hdl-agent:latest \
            opencode run --agent "$PICKED_AGENT" --auto --thinking --log-level INFO "$PROMPT"
