name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  pick-runner:
    uses: ./.github/workflows/pick-runner.yml
    secrets: inherit
    with:
      fallback: ubuntu-22.04

  test:
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.labels) }}
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/${{ github.repository_owner }}/axion-hdl-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Verify pre-built tools
      run: |
        ghdl --version
        verilator --version

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[dev]"
        python -m pip install pytest pytest-cov

    - name: Run all tests
      run: |
        make test
    
    - name: Upload test results
      if: matrix.python-version == '3.11' && always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: TEST_RESULTS.md

  lint:
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.labels) }}

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
    
    - name: Lint with flake8
      run: |
        flake8 axion_hdl/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 axion_hdl/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

  gui-test:
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.labels) }}

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[gui]"
        pip install pytest pytest-playwright
    
    - name: Install Playwright browsers
      run: |
        playwright install chromium
        playwright install-deps chromium
    
    - name: Run GUI tests
      run: |
        python -m pytest tests/python/test_gui.py -v --tb=short
    
    - name: Upload GUI test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: gui-test-results
        path: |
          test-results/
          playwright-report/
        if-no-files-found: ignore
