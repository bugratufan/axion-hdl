name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-verilator:
    runs-on: ubuntu-22.04

    steps:
    - name: Cache Verilator build
      id: verilator-cache
      uses: actions/cache@v4
      with:
        path: |
          /usr/local/bin/verilator*
          /usr/local/share/verilator
        # cocotb requires Verilator >=5.036; Ubuntu 22.04's apt package (4.038)
        # is too old, so build "stable" from source instead. Bump the key
        # suffix if the required minimum version ever changes.
        key: verilator-stable-${{ runner.os }}-v1

    - name: Build and install Verilator (>=5.036, required by cocotb)
      if: steps.verilator-cache.outputs.cache-hit != 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y git help2man perl make autoconf g++ flex bison ccache \
          libfl2 libfl-dev zlib1g zlib1g-dev
        git clone --depth 1 --branch stable https://github.com/verilator/verilator.git /tmp/verilator-src
        cd /tmp/verilator-src
        autoconf
        ./configure
        make -j"$(nproc)"
        sudo make install

    - name: Verify Verilator version
      run: verilator --version

  test:
    needs: build-verilator
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install GHDL
      run: |
        sudo apt-get update
        sudo apt-get install -y ghdl
        ghdl --version

    - name: Restore Verilator build
      id: verilator-cache
      uses: actions/cache/restore@v4
      with:
        path: |
          /usr/local/bin/verilator*
          /usr/local/share/verilator
        key: verilator-stable-${{ runner.os }}-v1

    - name: Verify Verilator version
      run: verilator --version

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install pytest pytest-cov
    
    - name: Run all tests
      run: |
        make test
    
    - name: Upload test results
      if: matrix.python-version == '3.11' && always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: TEST_RESULTS.md

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
    
    - name: Lint with flake8
      run: |
        flake8 axion_hdl/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 axion_hdl/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

  gui-test:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[gui]"
        pip install pytest pytest-playwright
    
    - name: Install Playwright browsers
      run: |
        playwright install chromium
        playwright install-deps chromium
    
    - name: Run GUI tests
      run: |
        python -m pytest tests/python/test_gui.py -v --tb=short
    
    - name: Upload GUI test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: gui-test-results
        path: |
          test-results/
          playwright-report/
        if-no-files-found: ignore
